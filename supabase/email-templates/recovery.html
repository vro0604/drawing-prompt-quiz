<!--
  Reset Password ／ パスワードの再設定

  type=recovery … KNOWN_TYPES に入っている。
  Magic Link と同じ理由で、既定の ?code= のままにしない。
-->
<h2>パスワードの再設定</h2>

<p>つたわるかな のパスワード再設定を受け付けました。</p>

<p>下のリンクを開くと、パスワードを設定し直せます。</p>

<p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">
    パスワードを再設定する
  </a>
</p>

<p>リンクが開けない場合は、次のURLをブラウザに貼り付けてください。</p>

<p>{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery</p>

<hr />

<p>このリンクは、別の端末で開いても使えます。</p>

<p>
  心当たりがない場合は、このメールを捨ててください。
  パスワードは変わりません。
</p>
